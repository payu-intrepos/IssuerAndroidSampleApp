plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.helloTridentity'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.helloTridentity"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def keystoreFile = rootProject.file("keystore.properties")
        if (keystoreFile.exists()) {
            def keystore = new Properties()
            keystore.load(new FileInputStream(keystoreFile))
            def clientId = keystore.getProperty('CLIENT_ID_DEV', '').trim()
            if (clientId.startsWith('"') && clientId.endsWith('"')) clientId = clientId[1..-2]
            def demoEnv = keystore.getProperty('DEMO_ENV', 'DEV').trim()
            if (demoEnv.startsWith('"') && demoEnv.endsWith('"')) demoEnv = demoEnv[1..-2]
            buildConfigField "String", "DEMO_CLIENT_ID", "\"$clientId\""
            buildConfigField "String", "DEMO_ENV", "\"$demoEnv\""
        } else {
            buildConfigField "String", "DEMO_CLIENT_ID", "\"\""
            buildConfigField "String", "DEMO_ENV", "\"Dev\""
        }
        // Use standard SDK variant only - no multiple flavors in this demo app
        missingDimensionStrategy "program", "standard"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation files ('libs/sdk-standard-release.aar') // tridentity aar shared
    // Use same versions as main app/SDK for Kotlin 1.6.20 compatibility (no duplicate stdlib)
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Firebase Cloud Messaging (push notifications) - same as sample app
    implementation platform('com.google.firebase:firebase-bom:29.0.2')
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.4.1'

    implementation 'in.payu:payuanalytics:1.5.3'

    implementation 'com.squareup.retrofit2:retrofit:2.6.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.bouncycastle:bcprov-jdk15+:1.46'
    implementation 'com.nimbusds:nimbus-jose-jwt:7.4'

    implementation 'com.scottyab:rootbeer-lib:0.1.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.23'
    implementation 'com.romainpiel.shimmer:library:1.4.0@aar'
    implementation "com.airbnb.android:lottie:5.0.3"

    testImplementation 'junit:junit:4.13.2'


}

// Align Kotlin stdlib with project (1.6.20) to avoid duplicate classes and metadata errors
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.6.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.20'
    }
}
